<% require "dotenv"; Dotenv.load(".env.staging") %>

# Staging Configuration - Inherits from deploy.yml with overrides
servers:
  web:
    host: <%= ENV['DOMAIN'] %>

proxy:
  ssl: true
  host: <%= ENV['DOMAIN'] %>  # Subdominio específico para staging

env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    RAILS_ENV: staging
    RAILS_LOG_TO_STDOUT: true
    SOLID_QUEUE_IN_PUMA: true
    DATABASE_URL: sqlite3:/rails/db/staging.sqlite3

volumes:
  - "puerto_bjj_staging_storage:/rails/storage"  # Volume separado de producción
  - "puerto_bjj_staging_uploads:/rails/public/uploads"  # Uploads separados

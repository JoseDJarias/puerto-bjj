        - name: "Kevin Matarrita Lara"
          role: "Instructor principal"
          bio: "Más de 10 años de experiencia en el tatami y un enfoque riguroso en la enseñanza. Su metodología prioriza la técnica limpia, la disciplina y el desarrollo integral de cada practicante, sin importar su punto de partida."
        - name: "Jose Daniel Arias"
          role: "Instructor asistente"
          bio: "Más de 5 años de trayectoria en Jiu-Jitsu. Enfocado en el acompañamiento técnico y la corrección de detalles para asegurar que cada alumno progrese de forma sólida y constante."
